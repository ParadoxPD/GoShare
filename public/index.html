<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoShare - Secure File Transfer</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --accent-primary: #3b82f6;
        --accent-secondary: #60a5fa;
        --accent-success: #10b981;
        --accent-danger: #ef4444;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        line-height: 1.6;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem;
      }

      header {
        text-align: center;
        margin-bottom: 3rem;
        padding: 2rem 0;
      }

      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .logo-icon {
        font-size: 3rem;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(
          135deg,
          var(--accent-primary),
          var(--accent-secondary)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        color: var(--text-secondary);
        font-size: 1.1rem;
        margin-top: 0.5rem;
      }

      .mode-selector {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-bottom: 2rem;
      }

      .mode-btn {
        padding: 1rem 2rem;
        background: var(--bg-secondary);
        border: 2px solid var(--border-color);
        border-radius: 12px;
        color: var(--text-primary);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .mode-btn:hover {
        background: var(--bg-tertiary);
        border-color: var(--accent-primary);
        transform: translateY(-2px);
        box-shadow: var(--shadow);
      }

      .mode-btn.active {
        background: var(--accent-primary);
        border-color: var(--accent-primary);
      }

      .card {
        background: var(--bg-secondary);
        border-radius: 16px;
        padding: 2rem;
        margin-bottom: 1.5rem;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow);
      }

      .qr-container {
        text-align: center;
        padding: 2rem;
      }

      .join-code {
        font-size: 3rem;
        font-weight: 700;
        color: var(--accent-primary);
        letter-spacing: 0.5rem;
        margin: 1.5rem 0;
        font-family: "Courier New", monospace;
      }

      #qrcode {
        margin: 2rem auto;
        padding: 1rem;
        background: white;
        border-radius: 12px;
        display: inline-block;
      }

      .input-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        color: var(--text-secondary);
        font-weight: 500;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
      }

      input[type="text"],
      input[type="file"] {
        width: 100%;
        padding: 0.75rem 1rem;
        background: var(--bg-tertiary);
        border: 2px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 1rem;
        transition: all 0.3s;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      input[type="file"] {
        cursor: pointer;
      }

      .btn {
        padding: 0.75rem 2rem;
        background: var(--accent-primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn:hover:not(:disabled) {
        background: var(--accent-secondary);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: var(--bg-tertiary);
      }

      .btn-secondary:hover:not(:disabled) {
        background: var(--border-color);
      }

      .file-list {
        margin-top: 1rem;
      }

      .file-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem;
        background: var(--bg-tertiary);
        border-radius: 8px;
        margin-bottom: 0.5rem;
      }

      .file-info {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex: 1;
      }

      .file-icon {
        font-size: 1.5rem;
      }

      .file-details {
        flex: 1;
      }

      .file-name {
        font-weight: 500;
        color: var(--text-primary);
      }

      .file-size {
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .file-remove {
        background: var(--accent-danger);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 0.5rem 1rem;
        cursor: pointer;
        font-size: 0.85rem;
      }

      .progress-container {
        margin-top: 1.5rem;
      }

      .progress-item {
        margin-bottom: 1.5rem;
      }

      .progress-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
      }

      .progress-title {
        font-weight: 500;
        color: var(--text-secondary);
      }

      .progress-percentage {
        color: var(--accent-primary);
        font-weight: 600;
      }

      .progress-bar {
        height: 8px;
        background: var(--bg-tertiary);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--accent-primary),
          var(--accent-secondary)
        );
        border-radius: 4px;
        transition: width 0.3s;
        position: relative;
      }

      .progress-fill::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        animation: shimmer 2s infinite;
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .status-badge.success {
        background: rgba(16, 185, 129, 0.2);
        color: var(--accent-success);
      }

      .status-badge.info {
        background: rgba(59, 130, 246, 0.2);
        color: var(--accent-primary);
      }

      .status-badge.warning {
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
      }

      .receiver-count {
        text-align: center;
        padding: 1rem;
        margin: 1rem 0;
      }

      .receiver-count-number {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--accent-success);
      }

      .receiver-count-label {
        color: var(--text-secondary);
        font-size: 0.9rem;
      }

      .log {
        background: var(--bg-primary);
        border-radius: 8px;
        padding: 1rem;
        max-height: 200px;
        overflow-y: auto;
        font-family: "Courier New", monospace;
        font-size: 0.85rem;
      }

      .log-entry {
        padding: 0.25rem 0;
        color: var(--text-muted);
        border-left: 2px solid transparent;
        padding-left: 0.5rem;
      }

      .log-entry.success {
        color: var(--accent-success);
        border-left-color: var(--accent-success);
      }

      .log-entry.error {
        color: var(--accent-danger);
        border-left-color: var(--accent-danger);
      }

      .log-entry.info {
        color: var(--accent-primary);
        border-left-color: var(--accent-primary);
      }

      .hidden {
        display: none !important;
      }

      .connection-status {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        padding: 0.75rem 1.5rem;
        border-radius: 30px;
        background: var(--bg-secondary);
        border: 2px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-weight: 500;
        box-shadow: var(--shadow);
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent-danger);
      }

      .status-dot.connected {
        background: var(--accent-success);
        box-shadow: 0 0 10px var(--accent-success);
      }

      @media (max-width: 768px) {
        .container {
          padding: 1rem;
        }

        h1 {
          font-size: 2rem;
        }

        .mode-selector {
          flex-direction: column;
        }

        .join-code {
          font-size: 2rem;
          letter-spacing: 0.3rem;
        }
      }

      /* Text Message Styles */
      .text-message-container {
        margin-top: 1.5rem;
      }

      .text-input-area {
        position: relative;
      }

      .text-input {
        width: 100%;
        min-height: 120px;
        padding: 1rem;
        background: var(--bg-primary);
        border: 2px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 1rem;
        font-family: "Inter", sans-serif;
        resize: vertical;
        transition: all 0.3s;
      }

      .text-input:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .text-input-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.75rem;
        gap: 1rem;
      }

      .text-char-count {
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      .text-char-count.warning {
        color: #f59e0b;
      }

      .text-actions {
        display: flex;
        gap: 0.5rem;
      }

      .messages-display {
        margin-top: 1.5rem;
        max-height: 400px;
        overflow-y: auto;
        padding: 1rem;
        background: var(--bg-primary);
        border-radius: 8px;
      }

      .message-item {
        padding: 1rem;
        background: var(--bg-secondary);
        border-radius: 8px;
        margin-bottom: 1rem;
        border-left: 3px solid var(--accent-primary);
        position: relative;
      }

      .message-item.sent {
        border-left-color: var(--accent-success);
      }

      .message-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }

      .message-type {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--accent-primary);
      }

      .message-item.sent .message-type {
        color: var(--accent-success);
      }

      .message-time {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .message-content {
        color: var(--text-primary);
        white-space: pre-wrap;
        word-wrap: break-word;
        line-height: 1.6;
        max-height: 300px;
        overflow-y: auto;
      }

      .message-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--border-color);
      }

      .btn-icon {
        padding: 0.5rem 1rem;
        background: var(--bg-tertiary);
        border: none;
        border-radius: 6px;
        color: var(--text-primary);
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn-icon:hover {
        background: var(--border-color);
      }

      .btn-icon.copied {
        background: var(--accent-success);
        color: white;
      }

      .empty-messages {
        text-align: center;
        padding: 2rem;
        color: var(--text-muted);
      }

      .encryption-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0.75rem;
        background: rgba(16, 185, 129, 0.1);
        border-radius: 12px;
        font-size: 0.75rem;
        color: var(--accent-success);
        margin-top: 0.5rem;
      }

      .tab-container {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        border-bottom: 2px solid var(--border-color);
      }

      .tab-btn {
        padding: 0.75rem 1.5rem;
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--text-secondary);
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s;
        margin-bottom: -2px;
      }

      .tab-btn:hover {
        color: var(--text-primary);
      }

      .tab-btn.active {
        color: var(--accent-primary);
        border-bottom-color: var(--accent-primary);
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      .notification {
        position: fixed;
        top: 2rem;
        right: 2rem;
        padding: 1rem 1.5rem;
        background: var(--bg-secondary);
        border: 2px solid var(--accent-success);
        border-radius: 8px;
        color: var(--text-primary);
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        animation: slideIn 0.3s ease-out;
        z-index: 1000;
      }

      @keyframes slideIn {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .notification.error {
        border-color: var(--accent-danger);
      }

      .notification-icon {
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">
          <span class="logo-icon">📦</span>
          <h1>GoShare</h1>
        </div>
        <p class="subtitle">Secure, encrypted file transfer across devices</p>
      </header>

      <div class="mode-selector">
        <button class="mode-btn" onclick="startReceiving()">
          <span>📥</span>
          <span>Receive Files</span>
        </button>
        <button class="mode-btn" onclick="startSending()">
          <span>📤</span>
          <span>Send Files</span>
        </button>
      </div>

      <div id="app"></div>
    </div>

    <div class="connection-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script>
      // Configuration
      const CHUNK_SIZE = 128 * 1024; // 128KB chunks for faster transfer
      const PARALLEL_CHUNKS = 3; // Number of chunks to send in parallel
      const ENCRYPTION_KEY = "gosharesecurekey"; // Should be 16 bytes for AES-128

      // State
      let ws = null;
      let currentMode = null;
      let sessionCode = null;
      let selectedFiles = [];
      let receiverCount = 0;
      let fileStates = new Map();
      let messages = [];
      let currentTab = "files";

      // Initialize WebSocket connection
      function connectWebSocket() {
        return new Promise((resolve, reject) => {
          const protocol =
            window.location.protocol === "https:" ? "wss:" : "ws:";
          ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

          ws.onopen = () => {
            log("Connected to server", "success");
            updateConnectionStatus(true);
            resolve();
          };

          ws.onclose = () => {
            log("Disconnected from server", "error");
            updateConnectionStatus(false);
            setTimeout(connectWebSocket, 3000);
          };

          ws.onerror = (error) => {
            log("Connection error", "error");
            updateConnectionStatus(false);
            reject(error);
          };

          ws.onmessage = handleMessage;
        });
      }

      // Update connection status indicator
      function updateConnectionStatus(connected) {
        const dot = document.getElementById("statusDot");
        const text = document.getElementById("statusText");

        if (connected) {
          dot.classList.add("connected");
          text.textContent = "Connected";
        } else {
          dot.classList.remove("connected");
          text.textContent = "Disconnected";
        }
      }

      // Handle incoming WebSocket messages
      function handleMessage(event) {
        const data = JSON.parse(event.data);
        log(`Received: ${data.type}`, "info");

        switch (data.type) {
          case "code":
            handleCodeReceived(data);
            break;
          case "joined":
            handleJoined(data);
            break;
          case "connected":
            handleSenderConnected(data);
            break;
          case "sender_connected":
            handleSenderConnectedToReceiver();
            break;
          case "receiver_count":
            updateReceiverCount(data.receivers);
            break;
          case "metadata":
            handleMetadata(data);
            break;
          case "chunk":
            handleChunk(data);
            break;
          case "done":
            handleFileDone(data);
            break;
          case "all_done":
            handleAllDone();
            break;
          case "text_message":
            handleTextMessage(data);
            break;
          case "text_ack":
            handleTextAck(data);
            break;
          case "error":
            handleError(data);
            break;
        }
      }

      // Logging function
      function log(message, type = "info") {
        console.log(`[${type.toUpperCase()}] ${message}`);

        const timestamp = new Date().toLocaleTimeString();
        const logEntry = document.createElement("div");
        logEntry.className = `log-entry ${type}`;
        logEntry.textContent = `[${timestamp}] ${message}`;

        const logContainer = document.querySelector(".log");
        if (logContainer) {
          logContainer.insertBefore(logEntry, logContainer.firstChild);
        }
      }

      // Start receiving mode
      async function startReceiving() {
        currentMode = "receive";
        messages = [];

        if (!ws || ws.readyState !== WebSocket.OPEN) {
          await connectWebSocket();
        }

        document.getElementById("app").innerHTML = `
                <div class="card">
                    <h2>📥 Receiving Mode</h2>
                    <p style="color: var(--text-secondary); margin: 1rem 0;">Share this code with the sender or scan the QR code</p>
                    
                    <div class="qr-container">
                        <div class="join-code" id="joinCode">------</div>
                        <canvas id="qrcode"></canvas>
                        <div class="status-badge info">
                            <span>⏳</span>
                            <span>Waiting for sender...</span>
                        </div>
                    </div>

                    <div class="receiver-count hidden" id="receiverCountContainer">
                        <div class="receiver-count-number" id="receiverCountNumber">0</div>
                        <div class="receiver-count-label">receivers connected</div>
                    </div>
                </div>

                <div class="card">
                    <div class="tab-container">
                        <button class="tab-btn active" onclick="switchTab('files')">📁 Files</button>
                        <button class="tab-btn" onclick="switchTab('messages')">💬 Messages</button>
                    </div>

                    <div id="filesTab" class="tab-content active">
                        <h3>File Transfer Progress</h3>
                        <div class="progress-container" id="progressContainer">
                            <p style="color: var(--text-muted); text-align: center;">No file transfers yet</p>
                        </div>
                    </div>

                    <div id="messagesTab" class="tab-content">
                        <h3>Received Messages</h3>
                        <div class="messages-display" id="messagesDisplay">
                            <div class="empty-messages">No messages received yet</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3>Activity Log</h3>
                    <div class="log"></div>
                </div>
            `;

        ws.send(JSON.stringify({ type: "register" }));
        log("Registered as receiver");
      }

      // Handle code received
      function handleCodeReceived(data) {
        sessionCode = data.code;
        document.getElementById("joinCode").textContent = sessionCode;

        QRCode.toCanvas(document.getElementById("qrcode"), sessionCode, {
          width: 200,
          margin: 2,
          color: {
            dark: "#3b82f6",
            light: "#ffffff",
          },
        });

        log(`Session code generated: ${sessionCode}`, "success");
      }

      // Handle sender connected to receiver
      function handleSenderConnectedToReceiver() {
        log("Sender connected!", "success");
        document.querySelector(".qr-container .status-badge").className =
          "status-badge success";
        document.querySelector(".qr-container .status-badge").innerHTML =
          "<span>✓</span><span>Sender connected</span>";
      }

      // Start sending mode
      async function startSending() {
        currentMode = "send";
        messages = [];

        if (!ws || ws.readyState !== WebSocket.OPEN) {
          await connectWebSocket();
        }

        document.getElementById("app").innerHTML = `
                <div class="card">
                    <h2>📤 Sending Mode</h2>
                    
                    <div class="input-group">
                        <label for="codeInput">Enter Receiver Code</label>
                        <input type="text" id="codeInput" placeholder="Enter 6-digit code" maxlength="6">
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <button class="btn" onclick="connectToReceiver()">
                            <span>🔗</span>
                            <span>Connect</span>
                        </button>
                    </div>

                    <div class="receiver-count hidden" id="receiverCountContainer">
                        <div class="receiver-count-number" id="receiverCountNumber">0</div>
                        <div class="receiver-count-label">receivers connected</div>
                    </div>
                </div>

                <div class="card">
                    <div class="tab-container">
                        <button class="tab-btn active" onclick="switchTab('files')">📁 Files</button>
                        <button class="tab-btn" onclick="switchTab('messages')">💬 Messages</button>
                    </div>

                    <div id="filesTab" class="tab-content active">
                        <h3>Send Files</h3>
                        <div class="input-group">
                            <label for="fileInput">Select Files</label>
                            <input type="file" id="fileInput" multiple onchange="handleFileSelection(event)">
                        </div>

                        <div class="file-list" id="fileList"></div>

                        <button class="btn" onclick="startTransfer()" id="sendBtn" disabled style="margin-top: 1rem;">
                            <span>🚀</span>
                            <span>Send Files</span>
                        </button>

                        <div class="progress-container" id="progressContainer" style="margin-top: 1.5rem;">
                            <p style="color: var(--text-muted); text-align: center;">Select files and connect to start</p>
                        </div>
                    </div>

                    <div id="messagesTab" class="tab-content">
                        <h3>Send Text Message</h3>
                        <div class="text-message-container">
                            <div class="text-input-area">
                                <textarea 
                                    class="text-input" 
                                    id="textInput" 
                                    placeholder="Type your encrypted message here... (up to 100,000 characters)"
                                    maxlength="100000"
                                    oninput="updateCharCount()"
                                ></textarea>
                                <div class="text-input-controls">
                                    <div>
                                        <span class="text-char-count" id="charCount">0 / 100,000</span>
                                        <div class="encryption-badge">
                                            <span>🔒</span>
                                            <span>End-to-end encrypted</span>
                                        </div>
                                    </div>
                                    <div class="text-actions">
                                        <button class="btn-icon" onclick="pasteText()">
                                            <span>📋</span>
                                            <span>Paste</span>
                                        </button>
                                        <button class="btn" onclick="sendTextMessage()" id="sendTextBtn" disabled>
                                            <span>📤</span>
                                            <span>Send Message</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="messages-display" id="messagesDisplay">
                                <div class="empty-messages">No messages sent yet</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3>Activity Log</h3>
                    <div class="log"></div>
                </div>
            `;

        log("Ready to send files and messages");
      }

      // Handle file selection
      function handleFileSelection(event) {
        selectedFiles = Array.from(event.target.files);
        updateFileList();
        log(`Selected ${selectedFiles.length} file(s)`);
      }

      // Update file list display
      function updateFileList() {
        const fileList = document.getElementById("fileList");

        if (selectedFiles.length === 0) {
          fileList.innerHTML = "";
          return;
        }

        fileList.innerHTML = selectedFiles
          .map(
            (file, index) => `
                <div class="file-item">
                    <div class="file-info">
                        <span class="file-icon">📄</span>
                        <div class="file-details">
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${formatBytes(file.size)}</div>
                        </div>
                    </div>
                    <button class="file-remove" onclick="removeFile(${index})">Remove</button>
                </div>
            `,
          )
          .join("");
      }

      // Remove file from selection
      function removeFile(index) {
        selectedFiles.splice(index, 1);
        updateFileList();
        log(`File removed`);
      }

      // Format bytes to human readable
      function formatBytes(bytes) {
        if (bytes === 0) return "0 Bytes";
        const k = 1024;
        const sizes = ["Bytes", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return (
          Math.round((bytes / Math.pow(k, i)) * 100) / 100 + " " + sizes[i]
        );
      }

      // Connect to receiver
      async function connectToReceiver() {
        const code = document.getElementById("codeInput").value.trim();

        if (!code || code.length !== 6) {
          alert("Please enter a valid 6-digit code");
          return;
        }

        if (!ws || ws.readyState !== WebSocket.OPEN) {
          await connectWebSocket();
        }

        sessionCode = code;
        ws.send(JSON.stringify({ type: "connect", code: code }));
        log("Connecting to receiver...");
      }

      // Handle sender connected response
      function handleSenderConnected(data) {
        receiverCount = data.receivers;
        updateReceiverCount(receiverCount);

        const sendBtn = document.getElementById("sendBtn");
        if (sendBtn) {
          sendBtn.disabled = selectedFiles.length === 0;
        }

        const sendTextBtn = document.getElementById("sendTextBtn");
        if (sendTextBtn) {
          const textInput = document.getElementById("textInput");
          sendTextBtn.disabled =
            !textInput || textInput.value.trim().length === 0;
        }

        log(`Connected! ${receiverCount} receiver(s) waiting`, "success");
      }

      // Update receiver count display
      function updateReceiverCount(count) {
        receiverCount = count;
        const container = document.getElementById("receiverCountContainer");
        const number = document.getElementById("receiverCountNumber");

        if (container && number) {
          container.classList.remove("hidden");
          number.textContent = count;
        }
      }

      // Start file transfer
      async function startTransfer() {
        if (selectedFiles.length === 0) {
          alert("Please select at least one file");
          return;
        }

        document.getElementById("sendBtn").disabled = true;
        log(`Starting transfer of ${selectedFiles.length} file(s)...`, "info");

        const progressContainer = document.getElementById("progressContainer");
        progressContainer.innerHTML = "";

        for (let i = 0; i < selectedFiles.length; i++) {
          const file = selectedFiles[i];
          const fileId = `file_${Date.now()}_${i}`;

          await transferFile(file, fileId, i, selectedFiles.length);
        }

        // Notify all receivers that all files are sent
        ws.send(
          JSON.stringify({
            type: "all_done",
            code: sessionCode,
          }),
        );

        log("All files transferred!", "success");
        document.getElementById("sendBtn").disabled = false;
      }

      // Transfer single file
      async function transferFile(file, fileId, fileIndex, totalFiles) {
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

        // Add progress bar
        const progressContainer = document.getElementById("progressContainer");
        const progressItem = document.createElement("div");
        progressItem.className = "progress-item";
        progressItem.id = `progress_${fileId}`;
        progressItem.innerHTML = `
                <div class="progress-header">
                    <span class="progress-title">${file.name}</span>
                    <span class="progress-percentage">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 0%"></div>
                </div>
            `;
        progressContainer.appendChild(progressItem);

        // Send metadata
        ws.send(
          JSON.stringify({
            type: "metadata",
            code: sessionCode,
            name: file.name,
            size: file.size,
            totalChunks: totalChunks,
            fileId: fileId,
            fileIndex: fileIndex,
            totalFiles: totalFiles,
          }),
        );

        log(
          `Sending ${file.name} (${formatBytes(file.size)}, ${totalChunks} chunks)`,
        );

        // Send chunks with parallel processing
        for (let i = 0; i < totalChunks; i += PARALLEL_CHUNKS) {
          const chunkPromises = [];

          for (let j = 0; j < PARALLEL_CHUNKS && i + j < totalChunks; j++) {
            const chunkIndex = i + j;
            chunkPromises.push(
              sendChunk(file, fileId, chunkIndex, totalChunks),
            );
          }

          await Promise.all(chunkPromises);

          // Update progress
          const progress = Math.min(
            ((i + PARALLEL_CHUNKS) / totalChunks) * 100,
            100,
          );
          updateProgress(fileId, progress);
        }

        // Send completion message
        ws.send(
          JSON.stringify({
            type: "done",
            code: sessionCode,
            name: file.name,
            fileId: fileId,
          }),
        );

        updateProgress(fileId, 100);
        log(`Completed: ${file.name}`, "success");
      }

      // Send single chunk
      async function sendChunk(file, fileId, chunkIndex, totalChunks) {
        const start = chunkIndex * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, file.size);
        const chunk = file.slice(start, end);

        const buffer = await chunk.arrayBuffer();
        const encrypted = await encryptChunk(buffer);

        ws.send(
          JSON.stringify({
            type: "chunk",
            code: sessionCode,
            index: chunkIndex,
            content: encrypted,
            fileId: fileId,
          }),
        );

        // Small delay to prevent overwhelming the connection
        await new Promise((resolve) => setTimeout(resolve, 10));
      }

      // Update progress bar
      function updateProgress(fileId, percentage) {
        const progressItem = document.getElementById(`progress_${fileId}`);
        if (progressItem) {
          const fill = progressItem.querySelector(".progress-fill");
          const text = progressItem.querySelector(".progress-percentage");

          fill.style.width = `${percentage}%`;
          text.textContent = `${Math.round(percentage)}%`;
        }
      }

      // Encrypt chunk using AES-CBC
      async function encryptChunk(buffer) {
        try {
          const key = await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(
              ENCRYPTION_KEY.padEnd(16, "0").slice(0, 16),
            ),
            { name: "AES-CBC" },
            false,
            ["encrypt"],
          );

          const iv = crypto.getRandomValues(new Uint8Array(16));
          const encrypted = await crypto.subtle.encrypt(
            { name: "AES-CBC", iv: iv },
            key,
            buffer,
          );

          // Combine IV and encrypted data
          const result = new Uint8Array(iv.length + encrypted.byteLength);
          result.set(iv, 0);
          result.set(new Uint8Array(encrypted), iv.length);

          return btoa(String.fromCharCode.apply(null, result));
        } catch (error) {
          log(`Encryption error: ${error.message}`, "error");
          throw error;
        }
      }

      // Decrypt chunk
      async function decryptChunk(base64) {
        try {
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }

          const iv = bytes.slice(0, 16);
          const data = bytes.slice(16);

          const key = await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(
              ENCRYPTION_KEY.padEnd(16, "0").slice(0, 16),
            ),
            { name: "AES-CBC" },
            false,
            ["decrypt"],
          );

          const decrypted = await crypto.subtle.decrypt(
            { name: "AES-CBC", iv: iv },
            key,
            data,
          );

          return new Uint8Array(decrypted);
        } catch (error) {
          log(`Decryption error: ${error.message}`, "error");
          throw error;
        }
      }

      // Handle metadata for receiver
      function handleMetadata(data) {
        const fileId = data.fileId;

        fileStates.set(fileId, {
          name: data.name,
          size: data.size,
          totalChunks: data.totalChunks,
          chunks: new Array(data.totalChunks),
          receivedCount: 0,
        });

        // Add progress bar
        const progressContainer = document.getElementById("progressContainer");
        if (!progressContainer.querySelector(".progress-item")) {
          progressContainer.innerHTML = "";
        }

        const progressItem = document.createElement("div");
        progressItem.className = "progress-item";
        progressItem.id = `progress_${fileId}`;
        progressItem.innerHTML = `
                <div class="progress-header">
                    <span class="progress-title">${data.name} (${data.fileIndex + 1}/${data.totalFiles})</span>
                    <span class="progress-percentage">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 0%"></div>
                </div>
            `;
        progressContainer.appendChild(progressItem);

        log(`Receiving: ${data.name} (${formatBytes(data.size)})`);
      }

      // Handle chunk for receiver
      function handleChunk(data) {
        const fileState = fileStates.get(data.fileId);
        if (!fileState) return;

        fileState.chunks[data.index] = data.content;
        fileState.receivedCount++;

        const progress =
          (fileState.receivedCount / fileState.totalChunks) * 100;
        updateProgress(data.fileId, progress);
      }

      // Handle file completion
      async function handleFileDone(data) {
        const fileState = fileStates.get(data.fileId);
        if (!fileState) return;

        log(`Processing ${data.name}...`);

        try {
          // Decrypt all chunks
          const decryptedChunks = [];
          for (let i = 0; i < fileState.chunks.length; i++) {
            if (!fileState.chunks[i]) {
              log(`Missing chunk ${i} for ${data.name}`, "error");
              return;
            }
            const decrypted = await decryptChunk(fileState.chunks[i]);
            decryptedChunks.push(decrypted);
          }

          // Create blob and download
          const blob = new Blob(decryptedChunks);
          const url = URL.createObjectURL(blob);

          const a = document.createElement("a");
          a.href = url;
          a.download = data.name;
          a.style.display = "none";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          log(`Downloaded: ${data.name}`, "success");
          updateProgress(data.fileId, 100);

          // Clean up
          fileStates.delete(data.fileId);
        } catch (error) {
          log(`Error processing ${data.name}: ${error.message}`, "error");
        }
      }

      // Handle all files done
      function handleAllDone() {
        log("All files received!", "success");
      }

      // Handle joined as additional receiver
      function handleJoined(data) {
        sessionCode = data.code;
        log("Joined existing session", "success");
      }

      // Handle errors
      function handleError(data) {
        log(data.error || "An error occurred", "error");
        alert(data.error || "An error occurred");
      }

      // Switch between tabs
      function switchTab(tabName) {
        currentTab = tabName;

        // Update tab buttons
        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.classList.remove("active");
        });
        event.target.classList.add("active");

        // Update tab content
        document.querySelectorAll(".tab-content").forEach((content) => {
          content.classList.remove("active");
        });

        if (tabName === "files") {
          document.getElementById("filesTab").classList.add("active");
        } else if (tabName === "messages") {
          document.getElementById("messagesTab").classList.add("active");
        }
      }

      // Update character count
      function updateCharCount() {
        const input = document.getElementById("textInput");
        const countDisplay = document.getElementById("charCount");
        const sendBtn = document.getElementById("sendTextBtn");

        if (input && countDisplay) {
          const length = input.value.length;
          countDisplay.textContent = `${length.toLocaleString()} / 100,000`;

          if (length > 80000) {
            countDisplay.classList.add("warning");
          } else {
            countDisplay.classList.remove("warning");
          }

          // Enable send button if connected and has text
          if (sendBtn) {
            sendBtn.disabled = !sessionCode || length === 0;
          }
        }
      }

      // Paste text from clipboard
      async function pasteText() {
        try {
          const text = await navigator.clipboard.readText();
          const input = document.getElementById("textInput");
          if (input) {
            input.value = text;
            updateCharCount();
            showNotification("Text pasted from clipboard", "success");
          }
        } catch (error) {
          log("Failed to paste from clipboard", "error");
          showNotification("Failed to paste. Please use Ctrl+V", "error");
        }
      }

      // Send encrypted text message
      async function sendTextMessage() {
        const input = document.getElementById("textInput");
        const text = input.value.trim();

        if (!text) {
          showNotification("Please enter a message", "error");
          return;
        }

        if (!sessionCode) {
          showNotification("Please connect to a receiver first", "error");
          return;
        }

        try {
          log("Encrypting message...");

          // Encrypt the text
          const encrypted = await encryptText(text);
          const messageId = `msg_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;

          // Send to server
          ws.send(
            JSON.stringify({
              type: "text_message",
              code: sessionCode,
              text: encrypted,
              messageId: messageId,
            }),
          );

          // Add to local messages
          messages.push({
            id: messageId,
            text: text,
            timestamp: Date.now(),
            sent: true,
          });

          // Update display
          updateMessagesDisplay();

          // Clear input
          input.value = "";
          updateCharCount();

          log("Message sent successfully", "success");
          showNotification("Message sent to all receivers", "success");
        } catch (error) {
          log(`Error sending message: ${error.message}`, "error");
          showNotification("Failed to send message", "error");
        }
      }

      // Handle received text message
      async function handleTextMessage(data) {
        try {
          log("Received encrypted message");

          // Decrypt the message
          const decrypted = await decryptText(data.text);

          // Add to messages
          messages.push({
            id: data.messageId,
            text: decrypted,
            timestamp: data.timestamp * 1000,
            sent: false,
          });

          // Update display
          updateMessagesDisplay();

          log("Message decrypted and received", "success");
          showNotification("New message received!", "success");

          // Switch to messages tab if not already there
          if (currentTab !== "messages") {
            const messagesTab = document.querySelector(".tab-btn:nth-child(2)");
            if (messagesTab) {
              messagesTab.style.animation = "pulse 1s ease-in-out";
              setTimeout(() => {
                messagesTab.style.animation = "";
              }, 1000);
            }
          }
        } catch (error) {
          log(`Error decrypting message: ${error.message}`, "error");
          showNotification("Failed to decrypt message", "error");
        }
      }

      // Handle text acknowledgment
      function handleTextAck(data) {
        log(`Message delivered to ${data.receivers} receiver(s)`, "success");
      }

      // Update messages display
      function updateMessagesDisplay() {
        const display = document.getElementById("messagesDisplay");
        if (!display) return;

        if (messages.length === 0) {
          display.innerHTML =
            '<div class="empty-messages">No messages yet</div>';
          return;
        }

        display.innerHTML = messages
          .map(
            (msg) => `
                <div class="message-item ${msg.sent ? "sent" : ""}">
                    <div class="message-header">
                        <span class="message-type">${msg.sent ? "Sent" : "Received"}</span>
                        <span class="message-time">${new Date(msg.timestamp).toLocaleString()}</span>
                    </div>
                    <div class="message-content">${escapeHtml(msg.text)}</div>
                    <div class="message-actions">
                        <button class="btn-icon" onclick="copyMessage('${msg.id}')">
                            <span>📋</span>
                            <span>Copy</span>
                        </button>
                        <button class="btn-icon" onclick="downloadMessage('${msg.id}')">
                            <span>💾</span>
                            <span>Download</span>
                        </button>
                    </div>
                </div>
            `,
          )
          .reverse()
          .join("");
      }

      // Copy message to clipboard
      async function copyMessage(messageId) {
        const message = messages.find((m) => m.id === messageId);
        if (!message) return;

        try {
          await navigator.clipboard.writeText(message.text);
          showNotification("Message copied to clipboard", "success");

          // Visual feedback
          const btn = event.target.closest(".btn-icon");
          if (btn) {
            btn.classList.add("copied");
            btn.innerHTML = "<span>✓</span><span>Copied!</span>";
            setTimeout(() => {
              btn.classList.remove("copied");
              btn.innerHTML = "<span>📋</span><span>Copy</span>";
            }, 2000);
          }
        } catch (error) {
          log("Failed to copy message", "error");
          showNotification("Failed to copy message", "error");
        }
      }

      // Download message as text file
      function downloadMessage(messageId) {
        const message = messages.find((m) => m.id === messageId);
        if (!message) return;

        const blob = new Blob([message.text], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `message_${new Date(message.timestamp).toISOString().slice(0, 10)}.txt`;
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showNotification("Message downloaded", "success");
      }

      // Encrypt text using AES-GCM
      async function encryptText(text) {
        try {
          const encoder = new TextEncoder();
          const data = encoder.encode(text);

          const key = await crypto.subtle.importKey(
            "raw",
            encoder.encode(ENCRYPTION_KEY.padEnd(16, "0").slice(0, 16)),
            { name: "AES-GCM" },
            false,
            ["encrypt"],
          );

          const iv = crypto.getRandomValues(new Uint8Array(12));
          const encrypted = await crypto.subtle.encrypt(
            { name: "AES-GCM", iv: iv },
            key,
            data,
          );

          // Combine IV and encrypted data
          const result = new Uint8Array(iv.length + encrypted.byteLength);
          result.set(iv, 0);
          result.set(new Uint8Array(encrypted), iv.length);

          return btoa(String.fromCharCode.apply(null, result));
        } catch (error) {
          log(`Encryption error: ${error.message}`, "error");
          throw error;
        }
      }

      // Decrypt text using AES-GCM
      async function decryptText(base64) {
        try {
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }

          const iv = bytes.slice(0, 12);
          const data = bytes.slice(12);

          const encoder = new TextEncoder();
          const key = await crypto.subtle.importKey(
            "raw",
            encoder.encode(ENCRYPTION_KEY.padEnd(16, "0").slice(0, 16)),
            { name: "AES-GCM" },
            false,
            ["decrypt"],
          );

          const decrypted = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            key,
            data,
          );

          const decoder = new TextDecoder();
          return decoder.decode(decrypted);
        } catch (error) {
          log(`Decryption error: ${error.message}`, "error");
          throw error;
        }
      }

      // Show notification
      function showNotification(message, type = "success") {
        const notification = document.createElement("div");
        notification.className = `notification ${type}`;
        notification.innerHTML = `
                <span class="notification-icon">${type === "success" ? "✓" : "⚠"}</span>
                <span>${message}</span>
            `;

        document.body.appendChild(notification);

        setTimeout(() => {
          notification.style.opacity = "0";
          setTimeout(() => {
            document.body.removeChild(notification);
          }, 300);
        }, 3000);
      }

      // Escape HTML to prevent XSS
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Initialize on load
      window.onload = () => {
        connectWebSocket();
      };
    </script>
  </body>
</html>
